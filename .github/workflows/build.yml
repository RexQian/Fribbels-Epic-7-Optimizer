name: Build offline draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reserved reviewed vX.Y.Z-offline tag
        required: true
        type: string
      candidate_commit:
        description: Exact reviewed candidate commit SHA
        required: true
        type: string
      build_only:
        description: Build and verify artifacts without creating a tag or draft
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-2025
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_commit }}
          persist-credentials: false
      - name: Verify candidate and frozen version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          test "$CANDIDATE_COMMIT" = "$(git rev-parse HEAD)"
          node -e 'const tag=process.env.RELEASE_TAG; const root=require("./package.json").version; const app=require("./app/package.json").version; if (tag!==`v${root}` || root!==app || !/^[0-9]+\.[0-9]+\.[0-9]+-offline(?:\.[0-9A-Za-z.-]+)?$/.test(root)) process.exit(1);'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: yarn
      - name: Build backend
        shell: bash
        run: |
          cd backend
          mvn package
          cp target/backend-1.0.jar ../data/jar/backend.jar
      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile
      - name: Verify offline hero, artifact and image loading with network denied
        run: node scripts/verify-optimizer-offline.cjs .
      - name: Build renderer and main
        run: yarn build
      - name: Patch locked dmg-builder for Python 3
        if: matrix.platform == 'macos'
        run: python3 scripts/patch-dmg-python3.py node_modules/dmg-builder
      - name: Package macOS without publishing
        if: matrix.platform == 'macos'
        env:
          PYTHON_PATH: /usr/bin/python3
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          BUILD_NUMBER: ''
          TRAVIS_BUILD_NUMBER: ''
          APPVEYOR_BUILD_NUMBER: ''
          CIRCLE_BUILD_NUM: ''
          BUILD_BUILDNUMBER: ''
          CI_PIPELINE_IID: ''
        run: npx electron-builder build --mac --x64 --arm64 --publish never
      - name: Package Windows without publishing
        if: matrix.platform == 'windows'
        run: npx electron-builder build --win --x64 --publish never
      - name: Verify offline cache inside built package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/offline-draft.py verify-package release
      - name: Record build provenance
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/offline-draft.py record release
      - uses: actions/upload-artifact@v4
        with:
          name: offline-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/build-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: build
    if: inputs.build_only != true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: offline-*
          path: draft-assets
          merge-multiple: true
      - name: Verify packages from both builds
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: python3 scripts/offline-draft.py verify draft-assets
      - name: Create or safely reuse draft
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: python3 scripts/offline-draft.py publish draft-assets
