name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'zulu'
          cache: maven

      - name: Build Backend (Maven)
        run: |
          cd backend
          mvn package
          cp target/backend-1.0.jar ../data/jar/backend.jar

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --pure-lockfile

      - name: Patch dmg-builder for Python 3
        if: matrix.os == 'macos-latest'
        run: |
          sed -i '' "s/reload(sys)/import importlib; importlib.reload(sys)/g" node_modules/dmg-builder/vendor/dmgbuild/core.py
          sed -i '' "s/sys.setdefaultencoding('UTF8')/pass/g" node_modules/dmg-builder/vendor/dmgbuild/core.py

      - name: Sync Version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Syncing version to $VERSION"
          
          # Update package.json versions
          npm version $VERSION --no-git-tag-version --allow-same-version
          cd app
          npm version $VERSION --no-git-tag-version --allow-same-version
          cd ..
          
          # Update updater.js using Python for cross-platform compatibility
          python3 -c "
          import re
          path = 'app/js/lib/updater.js'
          with open(path, 'r') as f:
              content = f.read()
          content = re.sub(r'const currentVersion = \".*\";', f'const currentVersion = \"$VERSION\";', content)
          with open(path, 'w') as f:
              f.write(content)
          print(f'Updated {path} to version $VERSION')
          "

      - name: Build Renderer & Main
        run: yarn build

      - name: Build Electron App (MacOS)
        if: matrix.os == 'macos-latest'
        # Skip the package-mac script and run builder directly to avoid python path issues
        run: npx electron-builder build --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON_PATH: /usr/bin/python3


          
      - name: Build Electron App (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder build --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
